services:
  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      APP_ENV: production
      DATABASE_URL: sqlite+aiosqlite:////data/kanbandoro.db
    ports:
      - "127.0.0.1:${KANBANDORO_BIND_PORT:-18080}:8000"
    volumes:
      - kanbandoro_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s
volumes:
  kanbandoro_data:
