name: Release da extensão

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validar versão da tag
        run: node -e "const fs=require('fs');const v=process.env.GITHUB_REF_NAME.slice(1);for(const p of ['package.json','package-lock.json','public/manifest.json'])if(JSON.parse(fs.readFileSync(p)).version!==v)throw Error(p+' não corresponde à tag '+v)"
      - run: npm run build
      - run: npm test
      - name: Empacotar extensão
        run: zip -qr "KanbanDoro-${GITHUB_REF_NAME}.zip" dist
      - name: Criar Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=()
          if [[ "$GITHUB_REF_NAME" == v0.* ]]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "KanbanDoro-${GITHUB_REF_NAME}.zip" --verify-tag --generate-notes --title "KanbanDoro ${GITHUB_REF_NAME#v}" "${args[@]}"
